name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach existing code without a push.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended adds the path-traversal and unsafe-deserialisation
          # queries, which are the relevant ones for code that resolves library
          # paths and deletes files.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
